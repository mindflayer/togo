name: Python Multi-version Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            os: ubuntu-22.04
          - python-version: '3.9'
            os: ubuntu-22.04
          - python-version: '3.10'
            os: ubuntu-latest
          - python-version: '3.11'
            os: ubuntu-latest
          - python-version: '3.12'
            os: ubuntu-latest
          - python-version: '3.13'
            os: ubuntu-latest
          - python-version: '3.14'
            os: ubuntu-latest
          - python-version: '3.15'
            os: ubuntu-latest
    env:
      # Keep in sync with build tools/prepare_vendor.sh
      GEOS_VERSION: '3.15.0'

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Compute cache base key
      id: cache-keys
      run: |
        echo "base_key=${{ runner.os }}-geos-${{ env.GEOS_VERSION }}-$(sha256sum tools/prepare_vendor.sh | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Restore GEOS vendor cache
      uses: actions/cache@v4
      with:
        path: vendor/geos
        key: ${{ steps.cache-keys.outputs.base_key }}-tests
        restore-keys: |
          ${{ steps.cache-keys.outputs.base_key }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build module and install it
      run: |
        ./tools/prepare_vendor.sh
        make build
        .venv/bin/pip install --force-reinstall dist/togo*.whl

    - name: Test with pytest
      run: |
        make test

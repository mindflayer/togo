name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cibw_skip: ""
            cibw_archs: ""
          - os: macos-13
            cibw_skip: "*-win32 *-win_amd64 *-musllinux_*"
            cibw_archs: "x86_64"
          - os: macos-14
            cibw_skip: "*-win32 *-win_amd64 *-musllinux_*"
            cibw_archs: "arm64"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Keep this in sync with tools/prepare_vendor.sh default or override as needed
      GEOS_VERSION: '3.14.1'
      CIBW_SKIP: ${{ matrix.cibw_skip }}
      CIBW_ARCHS: ${{ matrix.cibw_archs }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Compute cache base key
        id: cache-keys
        run: |
          echo "base_key=${{ runner.os }}-${{ runner.arch }}-geos-${{ env.GEOS_VERSION }}-$(python3 -c 'from hashlib import sha256; from pathlib import Path; print(sha256(Path("tools/prepare_vendor.sh").read_bytes()).hexdigest())')" >> "$GITHUB_OUTPUT"

      - name: Restore GEOS vendor cache
        uses: actions/cache@v4
        with:
          path: vendor/geos
          key: ${{ steps.cache-keys.outputs.base_key }}-wheels
          restore-keys: |
            ${{ steps.cache-keys.outputs.base_key }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare TG sources
        run: |
          python3 tools/prepare_tg.py

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.2.0
        env:
          # Ensure the GEOS_VERSION flows into the container for prepare_vendor.sh
          GEOS_VERSION: ${{ env.GEOS_VERSION }}
          CIBW_BEFORE_ALL_MACOS: "printf '#!/bin/sh\nsysctl -n hw.ncpu\n' > /tmp/nproc && chmod +x /tmp/nproc && sudo mv /tmp/nproc /usr/local/bin/nproc"
          # Linux-specific repair command using auditwheel
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "PLATFORM_ID=$(echo \"$CIBW_BUILD\" | cut -d- -f2-); LD_LIBRARY_PATH=/project/vendor/geos/${PLATFORM_ID}/lib auditwheel repair -w {dest_dir} {wheel}"
          # macOS uses delocate automatically, no custom command needed

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.os }}-${{ matrix.cibw_archs || 'native' }}
          path: ./wheelhouse/*.whl

  publish_pypi:
    needs: build_wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # This enables trusted publishing
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheelhouse-*
          path: ./wheelhouse/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./wheelhouse/
          skip-existing: true
